name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow (for the image tool test)
        run: pip install pillow
      - name: Install jsdom (for the UI smoke test)
        run: npm install --no-save --no-package-lock jsdom@24
      - name: Build data and bundle
        run: python3 tools/build_gear.py --bundle
      - name: Published data matches the CSVs
        run: git diff --exit-code docs/gear-data.js
      - name: Run all tests
        run: node tests/run_all.js
      - name: Keep the single-file build for download
        uses: actions/upload-artifact@v4
        with:
          name: hd2-randomizer
          path: dist/hd2-randomizer.html
          retention-days: 30
